# Producción / staging: API + base de datos.
# Uso: docker compose -f docker-compose.prod.yml up --build

services:

  postgres:
    image: postgres:16
    container_name: turnero_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: turnero
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: turnero123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d turnero"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: turnero_api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=turnero;Username=postgres;Password=turnero123"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
