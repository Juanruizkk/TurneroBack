# .github/workflows/ci.yml

name: CI — Build & Tests

# ── Cuándo se activa el workflow ──────────────────────────────────────────────
on:
  push:
    branches: [ main, master ]       # Cada push a la rama principal
  pull_request:
    branches: [ main, master ]       # Cada PR que apunta a main/master

# Si llega un nuevo push mientras ya corre un workflow en la misma rama,
# cancela el anterior para no desperdiciar minutos de CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Variables globales disponibles en todos los jobs
env:
  DOTNET_NOLOGO: true                  # Elimina el banner ASCII de dotnet en los logs
  DOTNET_CLI_TELEMETRY_OPTOUT: true    # No envía telemetría a Microsoft

jobs:

  # ─── JOB 1: Build + Unit Tests ──────────────────────────────────────────────
  unit-tests:
    name: "Build & Unit Tests"
    runs-on: ubuntu-latest             # VM con Ubuntu, Docker, .NET preinstalado

    steps:
      # 1. Descarga el código del repo en la VM
      - name: Checkout código
        uses: actions/checkout@v4

      # 2. Instala la versión exacta de .NET que usa el proyecto
      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Cache de paquetes NuGet
      #    La clave incluye un hash de todos los .csproj.
      #    Si no cambiaron las dependencias, restaura desde cache (~30s -> ~5s).
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 4. Descarga todos los paquetes NuGet declarados en el .sln
      - name: Restaurar dependencias
        run: dotnet restore TurneroApp.sln

      # 5. Compila la solución completa en modo Release
      #    --no-restore: ya restauramos en el step anterior, no repetir
      - name: Compilar solución
        run: dotnet build TurneroApp.sln --no-restore --configuration Release

      # 6. Ejecuta solo los unit tests (sin Docker, rápidos)
      #    --no-build: ya compilamos arriba, no volver a compilar
      #    --logger trx: genera un archivo de reporte XML (estándar Visual Studio)
      #    --results-directory: dónde guardar el .trx
      - name: Ejecutar Unit Tests
        run: |
          dotnet test tests/TurneroApp.Tests/TurneroApp.Tests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory ./test-results

      # 7. Sube el archivo de resultados como artefacto del run
      #    if: always() -> sube aunque los tests hayan fallado (para poder ver el reporte)
      - name: Subir resultados Unit Tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./test-results/*.trx

  # ─── JOB 2: Integration Tests ───────────────────────────────────────────────
  integration-tests:
    name: "Integration Tests (Docker)"
    runs-on: ubuntu-latest
    needs: unit-tests                  # Solo corre si el JOB 1 terminó OK

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar dependencias
        run: dotnet restore TurneroApp.sln

      - name: Compilar solución
        run: dotnet build TurneroApp.sln --no-restore --configuration Release

      # Docker Engine ya está disponible en ubuntu-latest.
      # Testcontainers lo detecta automáticamente y levanta los contenedores
      # de PostgreSQL que necesitan los tests.
      - name: Ejecutar Integration Tests
        run: |
          dotnet test tests/TurneroApp.IntegrationTests/TurneroApp.IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=integration-tests.trx" \
            --results-directory ./test-results
        env:
          # Ryuk es el "limpiador" de Testcontainers. En algunos entornos CI
          # puede fallar al intentar conectarse al daemon de Docker.
          # Deshabilitarlo es la práctica recomendada en GitHub Actions.
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Subir resultados Integration Tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./test-results/*.trx

  # ─── JOB 3: Deploy via Dokploy ───────────────────────────────────────────────
  deploy:
    name: "Deploy to Hostinger VPS (Dokploy)"
    runs-on: ubuntu-latest
    needs: integration-tests        # Solo despliega si todos los tests pasaron
    if: github.event_name == 'push' # No despliega en PRs, solo en push a main

    steps:
      - name: Trigger Dokploy webhook
        run: |
          curl -fsSL -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
