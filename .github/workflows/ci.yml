# .github/workflows/ci.yml

name: CI — Build, Tests, Seguridad & SBOM

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:

  # ─── JOB 1: Build + Unit Tests ──────────────────────────────────────────────
  unit-tests:
    name: "Build & Unit Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar dependencias
        run: dotnet restore TurneroApp.sln

      - name: Compilar solución
        run: dotnet build TurneroApp.sln --no-restore --configuration Release

      - name: Ejecutar Unit Tests
        run: |
          dotnet test tests/TurneroApp.Tests/TurneroApp.Tests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=unit-tests.trx" \
            --results-directory ./test-results

      - name: Subir resultados Unit Tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ./test-results/*.trx

  # ─── JOB 2: Integration Tests ───────────────────────────────────────────────
  integration-tests:
    name: "Integration Tests (Docker)"
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar dependencias
        run: dotnet restore TurneroApp.sln

      - name: Compilar solución
        run: dotnet build TurneroApp.sln --no-restore --configuration Release

      - name: Ejecutar Integration Tests
        run: |
          dotnet test tests/TurneroApp.IntegrationTests/TurneroApp.IntegrationTests.csproj \
            --no-build \
            --configuration Release \
            --logger "trx;LogFileName=integration-tests.trx" \
            --results-directory ./test-results
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

      - name: Subir resultados Integration Tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ./test-results/*.trx

  # ─── JOB 3: SonarCloud — Análisis de código ─────────────────────────────────
  # Secrets requeridos: SONAR_TOKEN
  # Variables requeridas: SONAR_PROJECT_KEY, SONAR_ORG
  # Crear en: https://sonarcloud.io → tu organización → proyecto → Information
  sonarcloud:
    name: "SonarCloud — Análisis de código"
    runs-on: ubuntu-latest

    steps:
      # fetch-depth: 0 es obligatorio para que SonarCloud pueda analizar
      # el historial de git y calcular métricas de blame/new code.
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Instalar SonarScanner para .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Instalar dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Restaurar dependencias
        run: dotnet restore TurneroApp.sln

      - name: Iniciar análisis SonarCloud
        run: dotnet sonarscanner begin /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar solución
        run: dotnet build TurneroApp.sln --no-restore --configuration Release

      - name: Ejecutar tests con cobertura
        run: |
          dotnet-coverage collect \
            "dotnet test tests/TurneroApp.Tests/TurneroApp.Tests.csproj --no-build --configuration Release" \
            -f xml -o coverage.coveragexml

      - name: Finalizar análisis SonarCloud
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── JOB 4: SBOM (CycloneDX) ────────────────────────────────────────────────
  sbom:
    name: "Generar SBOM (CycloneDX)"
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar dependencias
        run: dotnet restore TurneroApp.sln

      - name: Instalar CycloneDX
        run: dotnet tool install --global CycloneDX

      # Genera el SBOM listando todas las dependencias NuGet con versiones y licencias
      - name: Generar SBOM backend
        run: |
          mkdir -p sbom
          dotnet CycloneDX TurneroApp.sln -o sbom/ -j

      - name: Subir SBOM como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sbom-backend
          path: sbom/

  # ─── JOB 5: Snyk — Vulnerabilidades ─────────────────────────────────────────
  # Secret requerido: SNYK_TOKEN
  snyk:
    name: "Snyk — Vulnerabilidades"
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependencias
        run: dotnet restore TurneroApp.sln

      # Escanea dependencias NuGet declaradas en el .sln
      - name: Snyk test — dependencias NuGet
        uses: snyk/actions/dotnet@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Build imagen Docker backend
        run: docker build -t turnero-backend:${{ github.sha }} .

      # Escanea la imagen Docker por vulnerabilidades en OS y librerías
      - name: Snyk test — imagen Docker backend
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: turnero-backend:${{ github.sha }}
          args: --severity-threshold=high

  # ─── JOB 6: Deploy via Dokploy ───────────────────────────────────────────────
  deploy:
    name: "Deploy to Hostinger VPS (Dokploy)"
    runs-on: ubuntu-latest
    needs: [ integration-tests, sbom, snyk ]
    if: github.event_name == 'push'

    steps:
      - name: Trigger Dokploy webhook
        run: |
          curl -fsSL -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
